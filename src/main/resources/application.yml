spring:
  application:
    name: tech-talent-pulse
  datasource:
    url: ${TECH_TALENT_PULSE_DATASOURCE_URL}
    username: ${TECH_TALENT_PULSE_DATASOURCE_USERNAME}
    password: ${TECH_TALENT_PULSE_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: tech_talent_pulse
    default-schema: tech_talent_pulse
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tech_talent_pulse
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

tech-talent-pulse:
  admin:
    orchestration:
      enabled: false
  web:
    cors:
      allowed-origins: ${TECH_TALENT_PULSE_WEB_CORS_ALLOWED_ORIGINS:http://localhost:4321,http://127.0.0.1:4321,http://localhost:4322,http://127.0.0.1:4322}
  stack-exchange:
    base-url: https://api.stackexchange.com/2.3
    site: stackoverflow
    default-page-size: 25
    target-tags:
      - java
      - spring-boot
      - postgresql
      - docker
      - kubernetes
    scheduler-enabled: false
