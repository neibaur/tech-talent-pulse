services:
  postgres:
    image: postgres:16
    container_name: tech-talent-pulse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tech_talent_pulse}
      POSTGRES_USER: ${POSTGRES_USER:-tech_talent_pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tech_talent_pulse}
    ports:
      - "5432:5432"
    volumes:
      - tech_talent_pulse_postgres_data:/var/lib/postgresql/data

volumes:
  tech_talent_pulse_postgres_data:
