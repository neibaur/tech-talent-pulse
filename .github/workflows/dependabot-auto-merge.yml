# dependabot-auto-merge.yml
#
# Thin caller of the shared reusable workflow in neibaur-labs/ci-workflows. The
# logic lives there (one copy for every repository); this file owns the trigger
# and the paths filter. It arms GitHub auto-merge for Dependabot pull requests
# that contain only minor or patch npm and Maven updates. GitHub then merges the
# PR once every required status check passes.
#
# Policy: neibaur-labs/agent-ops docs/dependabot-auto-merge.md and GOVERNANCE.md
# section 10. Majors, prereleases, GitHub Actions updates, and PRs not opened by
# Dependabot are never armed and wait for the maintainer.
#
# Requires the repository setting "Allow auto-merge" (Settings > General).
# To stop it: turn that setting off, or disable this workflow
# (gh workflow disable dependabot-auto-merge.yml).
name: dependabot-auto-merge

on:
  pull_request:
    # A run that does not start is not billed. npm and Maven updates change a
    # manifest or lockfile; GitHub Actions updates change only
    # .github/workflows, so they never start a run that could do nothing.
    paths:
      - '**/package.json'
      - pnpm-lock.yaml
      - '**/pom.xml'

permissions: {}

jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: neibaur-labs/ci-workflows/.github/workflows/dependabot-auto-merge.yml@54372ac4d00e1a431cb3768c0f23bd9d1f164bf3 # v1.2.0
    with:
      ecosystems: 'npm,maven'
