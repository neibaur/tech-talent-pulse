name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-validate:
    name: build-and-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check Docker availability
        run: |
          docker version
          docker info
          docker ps

      - name: Print CI commit context
        run: |
          git rev-parse HEAD
          git status --short
          find src/test/java -name '*RepositoryTest.java' -print

      - name: Build and verify
        run: mvn clean verify

      - name: Print coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 } END { printf "Instruction coverage: %.2f%%\n", ic * 100 / (im + ic); printf "Line coverage: %.2f%%\n", lc * 100 / (lm + lc); printf "Branch coverage: %.2f%%\n", bc * 100 / (bm + bc); print "JaCoCo HTML report: target/site/jacoco/index.html"; print "JaCoCo XML report: target/site/jacoco/jacoco.xml" }' target/site/jacoco/jacoco.csv
          else
            echo "JaCoCo report not found."
          fi

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore

      - name: Validate Docker Compose config
        run: docker compose config

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --redact --verbose
